# All unspecified settings are shared defaults in ExperimentConfig.
reward: jev_shaping
output_dir: runs/jev_shaping/seed-0
seed: 0
model: Qwen/Qwen3.5-4B
model_revision: main  # Prefer --model-revision <commit>; sweep resolves this once.
train_data: data/train.jsonl
eval_data: data/validation.jsonl
updates: 100
rollouts_per_update: 8
generation_batch_size: 2
max_new_tokens: 48
gamma: 1.0
gae_lambda: 0.95
shaping_alpha: 0.5
judge_view: full
qwen_judge_revision: UNPINNED  # Set to your frozen server's exact checkpoint revision.
actor_gpu_usd_per_hour: null  # Required for dollar-comparison plots.
qwen_judge_gpu_usd_per_hour: null
