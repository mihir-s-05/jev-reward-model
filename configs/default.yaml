# All omitted fields use documented defaults in src/jev_reward/config.py.
model:
  name: Qwen/Qwen3.5-4B
  revision: main
  device: cuda:0
  dtype: bfloat16
  max_context: 16384
  max_new_tokens: 128
  lora_rank: 16
  lora_alpha: 32
ppo:
  updates: 100
  episodes_per_update: 8
  epochs: 2
  minibatch_turns: 8
  gamma: 1.0
  gae_lambda: 0.95
  shaping_alpha: 0.5
  eval_every: 10
  eval_episodes: 24
judge:
  context: full
  concurrency: 8
  jev_model: jev-latest
  llm_model: Qwen/Qwen3.5-9B
  # Set BOTH prices for a hosted comparator. null means unknown, not free.
  llm_input_per_million: null
  llm_output_per_million: null
