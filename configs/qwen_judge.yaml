name: qwen_judge
seed: 7
model: Qwen/Qwen3.5-4B
train_data: data/tasks.jsonl
reward: qwen_judge
output_dir: runs/qwen_judge
steps: 200
rollouts_per_step: 8
max_episode_steps: 8
max_new_tokens: 64
learning_rate: 1.0e-5
ppo_epochs: 2
gamma: 0.99
gae_lambda: 0.95
clip_range: 0.2
value_coef: 0.5
entropy_coef: 0.0
lora_r: 16
lora_alpha: 32
