[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-reward-model"
version = "0.1.0"
description = "Controlled Jev reward-model experiments with Qwen3.5-4B and PPO"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "httpx>=0.27,<1", "PyYAML>=6,<7"]

[project.optional-dependencies]
train = ["torch>=2.6,<3", "transformers>=5.3,<6", "peft>=0.18,<0.22", "accelerate>=1.4,<2", "safetensors>=0.5,<1"]
analysis = ["matplotlib>=3.8,<4"]
dev = ["pytest>=8,<10"]

[project.scripts]
jev-reward = "jev_reward.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
