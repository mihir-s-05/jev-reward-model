[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-reward-model"
version = "0.1.0"
description = "Research harness for comparing grounded and Jev-based rewards in PPO with Qwen3.5-4B."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "torch>=2.6",
  "transformers>=4.57.0",
  "trl>=0.23.0",
  "peft>=0.17.0",
  "accelerate>=1.10.0",
  "datasets>=3.6.0",
  "httpx>=0.28.0",
  "pydantic>=2.11.0",
  "PyYAML>=6.0.2",
  "numpy>=2.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "ruff>=0.12.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
