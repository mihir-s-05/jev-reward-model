[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-reward-model"
version = "0.2.0"
description = "Grounded comparisons of Jev rewards for Qwen3.5-4B PPO"
requires-python = ">=3.11"
dependencies = ["httpx>=0.28,<1", "PyYAML>=6.0,<7"]

[project.optional-dependencies]
train = ["torch>=2.6,<3", "transformers==5.17.0", "peft==0.21.0", "accelerate>=1.4,<2"]
dev = ["pytest>=8,<10", "torch>=2.6,<3"]
plots = ["matplotlib>=3.8,<4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
